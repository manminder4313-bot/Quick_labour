<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1e36" />
      <stop offset="40%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#143c6d" />
    </linearGradient>

    <!-- Glassmorphic Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdf7a" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lightning Bolt Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f5a623" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f5a623" flood-opacity="0.2" />
    </filter>

    <!-- Background Card Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)" filter="url(#shadow)" />
  
  <!-- Sleek Border -->
  <rect x="32" y="32" width="448" height="448" rx="104" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Premium lightning charge icon (centered) -->
  <path d="M266 76 L166 266 H246 L206 436 L346 236 H266 Z" fill="url(#bolt-grad)" filter="url(#glow)" />
</svg>