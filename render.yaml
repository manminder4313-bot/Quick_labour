services:
  # Unified Full-Stack Web Service serving both Express API and React Frontend
  - type: web
    name: quicklabour
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # User will input their MongoDB Atlas connection string during setup
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure authentication key
      - key: PORT
        value: 5000
